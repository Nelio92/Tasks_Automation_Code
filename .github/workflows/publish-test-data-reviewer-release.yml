name: Publish Test Data Reviewer Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package, for example v1.0.0
        required: true
        type: string
  push:
    tags:
      - tdr-v*

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: IFX_Scripts/Test_Data_Reviewer

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Create repository virtual environment
        run: |
          python -m venv ../../../.venv

      - name: Build release package
        run: |
          $version = '${{ github.event.inputs.version }}'
          if (-not $version) {
            $version = '${{ github.ref_name }}'
          }
          if ($version.StartsWith('tdr-')) {
            $version = $version.Substring(4)
          }

          ./publish_test_data_reviewer_release.ps1 -Version $version -NoPush